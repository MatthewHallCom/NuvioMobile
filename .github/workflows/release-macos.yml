name: Mac Catalyst Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      CATALYST: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Clone KSPlayer
        run: git clone --depth 1 https://github.com/kingslay/KSPlayer.git ../KSPlayer

      - name: Copy KSPlayer RNBridge files
        run: |
          mkdir -p ../KSPlayer/RNBridge
          cp backup_sdk54_upgrade/KSPlayerView.swift ../KSPlayer/RNBridge/
          cp backup_sdk54_upgrade/KSPlayerModule.swift ../KSPlayer/RNBridge/
          cp backup_sdk54_upgrade/KSPlayerViewManager.swift ../KSPlayer/RNBridge/
          cp backup_sdk54_upgrade/KSPlayerManager.m ../KSPlayer/RNBridge/

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods (Catalyst mode)
        run: cd ios && CATALYST=1 pod install --repo-update

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Fix KSPlayer SeekView for Catalyst
        run: |
          # Fix override keyword and non-optional layer for AppKit/Catalyst
          sed -i '' 's/#if canImport(AppKit)/#if canImport(AppKit)\n    override/' ../KSPlayer/Sources/KSPlayer/Video/SeekView.swift 2>/dev/null || true

      - name: Build Mac Catalyst
        run: |
          cd ios
          xcodebuild \
            -workspace Nuvio.xcworkspace \
            -scheme Nuvio \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            CODE_SIGN_IDENTITY="${{ secrets.MAC_CODE_SIGN_IDENTITY || '-' }}" \
            CODE_SIGNING_REQUIRED="${{ secrets.MAC_CODE_SIGN_IDENTITY && 'YES' || 'NO' }}" \
            CODE_SIGNING_ALLOWED="${{ secrets.MAC_CODE_SIGN_IDENTITY && 'YES' || 'NO' }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID || '' }}" \
            build \
            -derivedDataPath build

      - name: Package Mac App
        run: |
          APP_PATH=$(find ios/build -name "Nuvio.app" -path "*/Release-maccatalyst/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Nuvio.app not found"
            find ios/build -name "*.app" | head -5
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Create DMG
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Nuvio" -srcfolder dmg_staging -ov -format UDZO "Nuvio-macOS.dmg"
          echo "Created Nuvio-macOS.dmg"

      - name: Upload Mac App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-macOS
          path: Nuvio-macOS.dmg

      - name: Add to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Nuvio-macOS.dmg
          draft: true
          prerelease: true
