<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuvio</title>
    <style>
      @font-face { font-family: 'material'; src: url('/node_modules/react-native-vector-icons/Fonts/MaterialIcons.ttf') format('truetype'); }
      @font-face { font-family: 'MaterialIcons'; src: url('/node_modules/react-native-vector-icons/Fonts/MaterialIcons.ttf') format('truetype'); }
      @font-face { font-family: 'Material Design Icons'; src: url('/node_modules/react-native-vector-icons/Fonts/MaterialCommunityIcons.ttf') format('truetype'); }
      @font-face { font-family: 'MaterialCommunityIcons'; src: url('/node_modules/react-native-vector-icons/Fonts/MaterialCommunityIcons.ttf') format('truetype'); }
      @font-face { font-family: 'Ionicons'; src: url('/node_modules/react-native-vector-icons/Fonts/Ionicons.ttf') format('truetype'); }
      @font-face { font-family: 'Feather'; src: url('/node_modules/react-native-vector-icons/Fonts/Feather.ttf') format('truetype'); }
      @font-face { font-family: 'FontAwesome'; src: url('/node_modules/react-native-vector-icons/Fonts/FontAwesome.ttf') format('truetype'); }
      @font-face { font-family: 'FontAwesome5_Regular'; src: url('/node_modules/react-native-vector-icons/Fonts/FontAwesome5_Regular.ttf') format('truetype'); }
      @font-face { font-family: 'FontAwesome5_Solid'; src: url('/node_modules/react-native-vector-icons/Fonts/FontAwesome5_Solid.ttf') format('truetype'); }
      @font-face { font-family: 'FontAwesome5_Brands'; src: url('/node_modules/react-native-vector-icons/Fonts/FontAwesome5_Brands.ttf') format('truetype'); }
    </style>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a1a;
        color: #fff;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        position: fixed;
        width: 100%;
      }
      /* RNW injects a wrapper div inside #root that needs explicit height
         for flex:1 children to expand to fill the viewport */
      #root > div {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #loading-msg {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 18px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="loading-msg">Loading Nuvio...</div></div>
    <script type="module" src="/index.web.ts"></script>
    <script>
      // Catch and display any JS errors during startup
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:#ff6b6b;font-size:14px;white-space:pre-wrap;overflow:auto;height:100%">' +
          '<h2>Startup Error</h2>' + e.message + '\n\n' + (e.filename || '') + ':' + (e.lineno || '') +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:#ff6b6b;font-size:14px;white-space:pre-wrap;overflow:auto;height:100%">' +
          '<h2>Unhandled Promise Rejection</h2>' + (e.reason?.message || e.reason || 'Unknown error') +
          '\n\n' + (e.reason?.stack || '') + '</div>';
      });
    </script>
  </body>
</html>
